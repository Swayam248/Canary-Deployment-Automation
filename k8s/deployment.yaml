apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-app
  namespace: canary-demo
spec:
  replicas: 2

  selector:
    matchLabels:
      app: canary-app

  template:
    metadata:
      labels:
        app: canary-app

    spec:
      containers:
        - name: canary-app
          image: canary-app:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10